# SonarQube Static Application Security Testing (SAST) Configuration
# SecureCart PHP Web Application

sonar.projectKey=Samudralavikas2005_WAS_PROJECT
sonar.projectName=SecureCart Web Application
sonar.projectVersion=1.0.0

# Language & Source Encoding
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.language=php

# Exclusions (Exclude vendor dependencies, scratch scripts, and logs from analysis)
sonar.exclusions=vendor/**, scratch/**, *.log, database/*.sql

# Tests Configuration
sonar.tests=tests
sonar.test.inclusions=tests/**/*.php

# Security & Bug Thresholds (Quality Gate)
sonar.php.coverage.reportPaths=coverage.xml
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php
